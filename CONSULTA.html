<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNPJ Pro - Histórico Permanente</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 550px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #1a73e8; }
        
        button.primary { padding: 12px 20px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button.primary:hover { background: #1557b0; }
        
        #resultado { background: #fafafa; border-radius: 8px; padding: 15px; display: none; border: 1px solid #eee; }
        .secao-titulo { font-size: 11px; color: #1a73e8; text-transform: uppercase; margin: 15px 0 8px 0; border-bottom: 1px solid #eee; padding-bottom: 3px; font-weight: bold; letter-spacing: 1px; }
        
        .campo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; position: relative; }
        .label { font-weight: bold; color: #666; flex: 1; }
        
        .valor { color: #000; text-align: right; font-weight: 500; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.2s; position: relative; }
        .valor:hover { background: #e8f0fe; color: #1a73e8; }

        .status-ativa { color: #28a745 !important; font-weight: bold; }
        .status-outros { color: #d93025 !important; font-weight: bold; }

        .copy-toast { position: absolute; top: -20px; right: 0; background: #1a73e8; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; display: none; animation: fadeInOut 1s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(5px); } 20% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }

        .historico-container { width: 100%; max-width: 900px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { color: #333; margin-top: 0; border-left: 4px solid #1a73e8; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #1a73e8; text-transform: uppercase; font-size: 11px; }
        tbody tr { cursor: pointer; transition: 0.2s; }
        tbody tr:hover { background-color: #f1f3f4; }
    </style>
</head>
<body>

<div class="card">
    <h2>Consultor de Empresas</h2>
    <div class="input-group">
        <input type="text" id="cnpjInput" placeholder="Digite o CNPJ (só números)" maxlength="14">
        <button class="primary" onclick="buscarCNPJ()">Consultar</button>
    </div>
    <div id="resultado"></div>
</div>

<div class="historico-container">
    <h3>Histórico Permanente</h3>
    <table>
        <thead>
            <tr>
                <th>CNPJ</th>
                <th>Razão Social</th>
                <th>Cidade</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody id="corpoHistorico"></tbody>
    </table>
</div>

<script>
    // NOME DA CHAVE FIXO PARA NÃO PERDER O HISTÓRICO
    const NOME_DB = 'meu_historico_cnpj_final';

    window.onload = carregarHistorico;

    async function buscarCNPJ() {
        const input = document.getElementById('cnpjInput');
        const cnpj = input.value.replace(/\D/g, '');
        const resultadoDiv = document.getElementById('resultado');
        
        if (cnpj.length !== 14) {
            resultadoDiv.style.display = 'block';
            resultadoDiv.innerHTML = '<p style="color:red; text-align:center">CNPJ deve ter 14 dígitos.</p>';
            return;
        }

        resultadoDiv.style.display = 'block';
        resultadoDiv.innerHTML = '<em>Buscando informações no CNPJ.ws...</em>';

        try {
            // Nova API substituída aqui: endpoint público da cnpj.ws
            const response = await fetch(`https://publica.cnpj.ws/cnpj/${cnpj}`);
            
            if (response.status === 429) {
                throw new Error('Limite de consultas atingido (máx 3 por minuto no plano grátis).');
            }
            if (!response.ok) {
                throw new Error('Empresa não encontrada ou erro na requisição.');
            }

            const d = await response.json();
            const est = d.estabelecimento || {};

            // Mapeamento da Inscrição Estadual dentro da estrutura da CNPJ.ws
            const ie = est.inscricoes_estaduais?.length > 0 ? est.inscricoes_estaduais[0].inscricao_estadual : "N/A";

            // Tratamento do Telefone
            let telefoneCompleto = 'N/A';
            if (est.ddd1 && est.telefone1) {
                telefoneCompleto = `(0${est.ddd1.replace(/^0+/, '')}) ${est.telefone1}`;
            }

            // Mapeando a estrutura retornada da CNPJ.ws para o padrão do seu Card
            const dados = {
                razao: d.razao_social || '---',
                fantasia: est.nome_fantasia || '---',
                cnpj: est.cnpj || cnpj,
                ie: ie,
                situacao: est.situacao_cadastral || '---',
                logradouro: est.logradouro || '---',
                numero: est.numero || '---',
                complemento: est.complemento || '---',
                bairro: est.bairro || '---',
                cep: est.cep || '---',
                municipio: est.cidade?.nome || '---',
                uf: est.estado?.sigla || '---',
                tel: telefoneCompleto
            };

            exibirNoCard(dados);
            salvarNoHistorico(dados);

        } catch (error) {
            resultadoDiv.innerHTML = `<p style="color:red; text-align:center">${error.message}</p>`;
        }
    }

    function criarLinhaCampo(label, valor, classeExtra = "") {
        return `
            <div class="campo">
                <span class="label">${label}:</span>
                <span class="valor ${classeExtra}" onclick="copiarTexto(this, '${valor}')" title="Clique para copiar">
                    <span class="copy-toast">Copiado!</span>
                    ${valor}
                </span>
            </div>
        `;
    }

    function exibirNoCard(d) {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.style.display = 'block';
        document.getElementById('cnpjInput').value = d.cnpj;

        const corStatus = d.situacao === "Ativa" || d.situacao === "ATIVA" ? "status-ativa" : "status-outros";

        resultadoDiv.innerHTML = `
            <div class="secao-titulo">Identificação</div>
            ${criarLinhaCampo("Situação", d.situacao, corStatus)}
            ${criarLinhaCampo("Razão Social", d.razao)}
            ${criarLinhaCampo("Nome Fantasia", d.fantasia)}
            ${criarLinhaCampo("CNPJ", d.cnpj)}
            ${criarLinhaCampo("IE", d.ie)}

            <div class="secao-titulo">Endereço</div>
            ${criarLinhaCampo("Rua", d.logradouro)}
            ${criarLinhaCampo("Número", d.numero)}
            ${criarLinhaCampo("Complemento", d.complemento)}
            ${criarLinhaCampo("Bairro", d.bairro)}
            ${criarLinhaCampo("CEP", d.cep)}
            ${criarLinhaCampo("Município", d.municipio)}
            ${criarLinhaCampo("Estado (UF)", d.uf)}

            <div class="secao-titulo">Contato</div>
            ${criarLinhaCampo("Telefone", d.tel)}
        `;
    }

    function copiarTexto(el, texto) {
        navigator.clipboard.writeText(texto).then(() => {
            const toast = el.querySelector('.copy-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1000);
        });
    }

    function salvarNoHistorico(item) {
        let historico = JSON.parse(localStorage.getItem(NOME_DB)) || [];
        historico = historico.filter(h => h.cnpj !== item.cnpj);
        historico.unshift(item);
        localStorage.setItem(NOME_DB, JSON.stringify(historico));
        carregarHistorico();
    }

    function carregarHistorico() {
        const corpo = document.getElementById('corpoHistorico');
        const historico = JSON.parse(localStorage.getItem(NOME_DB)) || [];
        corpo.innerHTML = historico.map((h, index) => `
            <tr onclick='restaurarConsulta(${index})'>
                <td>${h.cnpj}</td>
                <td>${h.razao}</td>
                <td>${h.municipio}</td>
                <td class="${h.situacao === 'Ativa' || h.situacao === 'ATIVA' ? 'status-ativa' : ''}">${h.situacao}</td>
            </tr>
        `).join('');
    }

    function restaurarConsulta(index) {
        const historico = JSON.parse(localStorage.getItem(NOME_DB)) || [];
        if (historico[index]) {
            exibirNoCard(historico[index]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    document.getElementById('cnpjInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscarCNPJ();
    });
</script>

</body>
</html>
